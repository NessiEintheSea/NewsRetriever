name: Daily News Digest

# Rank + diversify + summarise + deliver to Discord/Slack.
on:
  schedule:
    # 07:00 JST = 22:00 UTC. Cron in GitHub Actions is always UTC:
    # JST = UTC+9, so subtract 9 hours from the JST time you want.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: news-db
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore news DB
        uses: actions/cache@v4
        with:
          path: data
          key: news-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-db-

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          DATABASE_URL: "sqlite:///data/news.db"
          NOTIFIER: ${{ vars.NOTIFIER || 'discord' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DELIVER_MINOR_UPDATES: ${{ vars.DELIVER_MINOR_UPDATES || 'false' }}
        run: PYTHONPATH=. python main.py digest
