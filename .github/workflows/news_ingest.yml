name: News Ingestion

# Fetch + dedup + embed + story linking. Runs often; never delivers.
on:
  schedule:
    # Every 3 hours (UTC). Cron in GitHub Actions is always UTC.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      genres:
        description: "Comma-separated genres"
        required: false
        default: "japan,world,tech,ai,crypto"

concurrency:
  # Never let ingest and digest touch the DB cache at the same time.
  group: news-db
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the SQLite DB from the most recent run (best-effort).
      - name: Restore news DB
        uses: actions/cache@v4
        with:
          path: data
          key: news-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-db-

      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          DATABASE_URL: "sqlite:///data/news.db"
          GENRES: ${{ github.event.inputs.genres || 'japan,world,tech,ai,crypto' }}
          # Optional quality upgrades (see README):
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'local' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FETCH_FULL_TEXT: ${{ vars.FETCH_FULL_TEXT || 'false' }}
        run: PYTHONPATH=. python main.py ingest
